<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixAI Prompt Generator</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a href="./index.html">ChatGPT提案版</a>
    <button id="goToBottomBtn" class="go-to-bottom" title="最下部へ移動">
      最下部へ移動
    </button>
    <div class="container">
      <!-- JSONから自動生成されるサブグループ -->
      <div id="ui-root"></div>

      <!-- 操作ボタン -->
      <!-- プリセット保存・読み込み -->

      <button id="generate">カンマ区切りプロンプト生成</button>
      <button id="copy">コピー</button>
      <button id="clearAll">全てクリア</button>
      <div class="output" id="output"></div>
    </div>
    <!-- 履歴/プリセット管理セクション (preset.jsが依存する要素) -->
    <div>
      <h2>履歴/プリセット管理</h2>

      <!-- プリセット保存 -->
      <div>
        <!-- ID: presetName (必須) -->
        <input
          type="text"
          id="presetName"
          placeholder="履歴/プリセット名を入力"
        />
        <!-- ID: savePresetBtn (必須) -->
        <button id="savePresetBtn">現在のプロンプトを保存</button>
      </div>

      <!-- 履歴リスト -->
      <h3>保存された履歴</h3>
      <!-- ID: historyListContainer (必須) -->
      <div id="historyListContainer">
        <!-- 履歴アイテムはJSによってここにレンダリングされます -->
        <p>読み込み中...</p>
      </div>
    </div>
    <button id="backToTopBtn" class="back-to-top" title="トップへ戻る">
      topへ
    </button>
    <p></p>
    <script type="module" src="js/script_hookup.js"></script>
    <script type="module" src="js/back_to_top.js"></script>
    <script type="module" src="js/go_to_bottom.js"></script>
  </body>
</html>
